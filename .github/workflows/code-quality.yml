name: Code Quality

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: code-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  code-quality:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            command: bun run check
          - name: Format
            command: bun run fix && git diff --exit-code
          - name: Typecheck
            command: bun run typecheck
          - name: Test
            command: bun run test
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.4"
          cache-dependency-path: |
            apps/api/go.sum
            packages/core/go.sum
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build
        if: ${{ matrix.name != 'Format' }}
        run: bun run build
      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}
